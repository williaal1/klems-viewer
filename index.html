<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLEMS Viewer</title>
  <link rel="icon" href="fop/assets/favicon.png">
  <link rel="stylesheet" href="fop/css/fop-tokens.css">
  <link rel="stylesheet" href="fop/css/fop-base.css">
  <link rel="stylesheet" href="css/frame.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <header class="fop-masthead">
    <div class="fop-masthead__inner">
      <span class="fop-masthead__home">
        <img class="fop-masthead__bug" src="fop/assets/union-bug-dark-teal.png" alt="Forces of Production">
        <img class="fop-masthead__wordmark" src="fop/assets/wordmark-dark-teal.png" alt="">
      </span>
      <span class="masthead-title">KLEMS Viewer</span>
    </div>
  </header>
  <main id="app">
    <section class="shelves-pane" aria-label="The 63 industries of the US economy in 2017, on shelves by kind of industry">
      <div class="intro">
        <h1>The US economy, 2017</h1>
        <p class="intro-sub">63 industries · size = value added · select one for its production function</p>
      </div>
      <div id="bookcase"></div>
      <p class="fop-figure__source source">Source: BEA-BLS Integrated Industry-Level Production Account (April 2025 release) | Forces of Production</p>
    </section>
    <aside id="panel" class="panel" hidden aria-label="Industry readout"></aside>
  </main>
  <div id="tip" class="fop-tooltip" hidden></div>
  <footer class="fop-footer">
    <div class="fop-footer__inner">
      <span>Forces of Production · a newsletter from Common Wealth</span>
      <span class="fop-footer__logos">
        <img src="fop/assets/cw-logo-dark-gray.png" alt="Common Wealth">
        <img src="fop/assets/union-bug-dark-teal.png" alt="Forces of Production">
      </span>
    </div>
  </footer>
  <script type="module" src="js/bookcase.js"></script>
</body>
</html>
